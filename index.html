<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAGE</title>
    <!-- Memanggil Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            /* PROTEKSI: Mencegah teks diseleksi/diblok (Copy Paste) */
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        img {
            -webkit-user-drag: none;
            user-drag: none;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-white min-h-screen flex flex-col m-0 p-0" oncontextmenu="return false;">

    <!-- BAGIAN HEADER -->

        <!-- Logo -->
        <div class="flex items-center">
            <img src="logo.png" alt="Logo SGS" class="h-8 md:h-10 object-contain">
        </div>

        <!-- Tombol WhatsApp di Kanan -->
        <div class="flex items-center">
            <a href="https://wa.me/6285771188235" target="_blank" class="bg-green-500 hover:bg-green-600 text-white font-bold py-1.5 px-3 md:py-2 md:px-5 rounded-full transition duration-300 flex items-center gap-1.5 md:gap-2 text-[11px] md:text-base" style="pointer-events: auto;">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 md:w-[18px] md:h-[18px]" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
                </svg>
                <span>WhatsApp</span>
            </a>
        </div>
    </header>

    <!-- BAGIAN KONTEN UTAMA (Full Width tanpa batas kiri-kanan) -->
    <main class="flex-grow w-full flex flex-col">

        <!-- KOTAK KONTEN FULL LEBAR -->
        <div class="w-full flex flex-col md:flex-row-reverse bg-white border-b border-gray-200">
            <!-- Gambar Melebar ke Samping -->
            <div class="w-full md:w-1/2 h-[280px] md:h-[420px] bg-gray-100 flex-shrink-0">
                <img src="citepus.jpg" alt="Citepus Beach" class="w-full h-full object-cover">
            </div>
            <!-- Teks Rapih (Rata Kiri agar jarak antar kata tidak renggang/lebar) -->
            <div class="w-full md:w-1/2 p-6 md:p-12 flex flex-col justify-center text-left">
                <h1 class="text-2xl md:text-4xl font-bold text-gray-800 mb-3 md:mb-4">
                    Citepus Beach
                </h1>
                <p class="text-sm md:text-base text-gray-600 leading-normal font-normal">
                    Pemandangan Pantai Citepus, Palabuhanratu Kab. Sukabumi yang indah dan mempesona untuk dikunjungi bersama keluarga maupun kerabat terdekat.
                </p>
            </div>
        </div>

    </main>

    <!-- BAGIAN FOOTER DENGAN COPYRIGHT 2026 -->
    <footer class="py-6 px-4 text-center border-t border-gray-200 bg-gray-50 mt-auto">
        <p class="text-xs md:text-sm text-gray-500 font-medium">
            &copy; 2026 SGS.BIZ.ID. All rights reserved.
        </p>
    </footer>

    <!-- SCRIPT PROTEKSI -->
    <script>
        document.addEventListener('copy', function(e) { e.preventDefault(); });
        document.addEventListener('cut', function(e) { e.preventDefault(); });
        document.addEventListener('paste', function(e) { e.preventDefault(); });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12') { e.preventDefault(); }
            if (e.ctrlKey || e.metaKey) {
                const forbiddenKeys = ['c', 'v', 'x', 's', 'u', 'p', 'a'];
                if (forbiddenKeys.includes(e.key.toLowerCase())) { e.preventDefault(); }
            }
        });
    </script>
</body>
</html>
